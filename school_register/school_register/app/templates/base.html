<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}High Profile Private Secondary School – Attendance{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --navy: #0a2540;
            --navy-dark: #06182b;
            --sky: #4fc3f7;
            --sky-light: #e1f5fe;
            --sky-dark: #0288d1;
            --success: #198754;
            --danger: #dc3545;
        }
        body {
            background-color: #f0f7fc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding-bottom: 80px;
        }
        .navbar {
            background: linear-gradient(135deg, var(--navy), var(--navy-dark));
            box-shadow: 0 2px 12px rgba(10, 37, 64, 0.25);
        }
        .navbar-brand {
            font-size: 1.05rem;
        }
        .card {
            border: none;
            border-radius: 14px;
            box-shadow: 0 2px 14px rgba(10, 37, 64, 0.07);
        }
        .btn-primary {
            background-color: var(--navy);
            border-color: var(--navy);
        }
        .btn-primary:hover, .btn-primary:focus {
            background-color: var(--navy-dark);
            border-color: var(--navy-dark);
        }
        .btn-sky {
            background-color: var(--sky);
            border-color: var(--sky);
            color: #00334d;
            font-weight: 600;
        }
        .btn-sky:hover {
            background-color: var(--sky-dark);
            border-color: var(--sky-dark);
            color: white;
        }
        .student-row {
            transition: background 0.15s;
        }
        .student-row.present {
            background-color: #d1e7dd;
        }
        .student-row.absent {
            background-color: #f8d7da;
        }
        .status-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #cfe8f7;
            z-index: 1000;
            box-shadow: 0 -2px 12px rgba(10, 37, 64, 0.08);
        }
        .bottom-nav a {
            color: #6c757d;
            text-decoration: none;
            font-size: 0.7rem;
            padding: 8px 0;
        }
        .bottom-nav a.active {
            color: var(--navy);
            font-weight: 600;
        }
        .bottom-nav i {
            font-size: 1.3rem;
            display: block;
            margin-bottom: 2px;
        }
        .stat-card {
            text-align: center;
            padding: 1rem;
        }
        .stat-number {
            font-size: 1.8rem;
            font-weight: 700;
        }
        .reason-input {
            display: none;
        }
        .reason-input.show {
            display: block;
        }
        .school-header {
            background: linear-gradient(135deg, var(--navy), #0d3a5c);
            color: white;
            border-radius: 14px;
            padding: 1.25rem;
            margin-bottom: 1.25rem;
        }
        .school-header h5 {
            margin: 0;
            font-weight: 700;
        }
        .school-header small {
            opacity: 0.85;
        }
        .bg-navy {
            background-color: var(--navy) !important;
        }
        .text-navy {
            color: var(--navy) !important;
        }
        .bg-sky {
            background-color: var(--sky) !important;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Top Navbar -->
    <nav class="navbar navbar-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/dashboard">
                <i class="bi bi-clipboard2-check me-1"></i> Attendance
            </a>
            <div class="d-flex align-items-center text-white">
                <span id="userName" class="me-3 small d-none d-sm-inline"></span>
                <button class="btn btn-sm btn-outline-light" onclick="logout()">
                    <i class="bi bi-box-arrow-right"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-3">
        {% block content %}{% endblock %}
    </main>

        <!-- Bottom Navigation (mobile friendly) -->
    <nav class="bottom-nav d-md-none">
        <div class="d-flex justify-content-around">
            <a href="/dashboard" class="text-center flex-fill {% if request.url.path == '/dashboard' %}active{% endif %}">
                <i class="bi bi-house"></i>Home
            </a>
            <a href="/mark-attendance" class="text-center flex-fill {% if request.url.path == '/mark-attendance' %}active{% endif %}">
                <i class="bi bi-pencil-square"></i>Attend
            </a>
            <a href="/activities" class="text-center flex-fill {% if request.url.path == '/activities' %}active{% endif %}">
                <i class="bi bi-journal-text"></i>Activity
            </a>
            <a href="/report" class="text-center flex-fill {% if request.url.path == '/report' %}active{% endif %}">
                <i class="bi bi-file-earmark-text"></i>Report
            </a>
        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function getToken() {
            return localStorage.getItem('token');
        }

        function setToken(token) {
            localStorage.setItem('token', token);
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login';
        }

        function requireAuth() {
            if (!getToken()) {
                window.location.href = '/login';
                return false;
            }
            return true;
        }

        async function api(url, options = {}) {
            const token = getToken();
            const headers = {
                'Content-Type': 'application/json',
                ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
                ...options.headers
            };
            const res = await fetch(url, { ...options, headers });
            if (res.status === 401) {
                logout();
                throw new Error('Unauthorized');
            }
            return res;
        }

        async function loadUser() {
            try {
                const res = await api('/api/auth/me');
                if (res.ok) {
                    const user = await res.json();
                    localStorage.setItem('user', JSON.stringify(user));
                    const el = document.getElementById('userName');
                    if (el) el.textContent = user.full_name;
                }
            } catch (e) {}
        }

        if (window.location.pathname !== '/login' && window.location.pathname !== '/') {
            if (requireAuth()) loadUser();
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
