{% extends "base.html" %}
{% block title %}Change Password – High Profile Private Secondary School{% endblock %}

{% block content %}
<h4 class="fw-bold mb-3 text-navy">Change Password</h4>

<div class="row justify-content-center">
    <div class="col-12 col-md-6">
        <div class="card">
            <div class="card-body">
                <div id="errorAlert" class="alert alert-danger d-none"></div>
                <div id="successAlert" class="alert alert-success d-none"></div>

                <div class="mb-3">
                    <label class="form-label">Current Password</label>
                    <input type="password" id="currentPassword" class="form-control form-control-lg" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input type="password" id="newPassword" class="form-control form-control-lg" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Confirm New Password</label>
                    <input type="password" id="confirmPassword" class="form-control form-control-lg" required>
                </div>
                <button class="btn btn-primary btn-lg w-100" onclick="changePassword()">
                    <i class="bi bi-key"></i> Change Password
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function changePassword() {
    const current = document.getElementById('currentPassword').value;
    const newPass = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;
    const errorEl = document.getElementById('errorAlert');
    const successEl = document.getElementById('successAlert');

    errorEl.classList.add('d-none');
    successEl.classList.add('d-none');

    if (!current || !newPass || !confirm) {
        errorEl.textContent = 'Please fill all fields';
        errorEl.classList.remove('d-none');
        return;
    }

    if (newPass !== confirm) {
        errorEl.textContent = 'New password and confirmation do not match';
        errorEl.classList.remove('d-none');
        return;
    }

    if (newPass.length < 6) {
        errorEl.textContent = 'New password must be at least 6 characters';
        errorEl.classList.remove('d-none');
        return;
    }

    try {
        const res = await api('/api/auth/change-password', {
            method: 'POST',
            body: JSON.stringify({
                current_password: current,
                new_password: newPass
            })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Failed to change password');

        successEl.textContent = data.message;
        successEl.classList.remove('d-none');

        // Clear fields
        document.getElementById('currentPassword').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';

        // Optional: logout after a few seconds so they login with new password
        setTimeout(() => {
            logout();
        }, 2500);
    } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('d-none');
    }
}
</script>
{% endblock %}
