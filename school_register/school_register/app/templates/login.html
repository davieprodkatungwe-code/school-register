{% extends "base.html" %}
{% block title %}Login – High Profile Private Secondary School{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-12 col-sm-8 col-md-5 col-lg-4">
        <div class="text-center mb-4">
            <div class="school-header text-start">
                <h5>High Profile Private Secondary School</h5>
                <small>Attendance Register System</small>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-clipboard2-check text-navy" style="font-size: 2.8rem;"></i>
                    <h5 class="mt-2 fw-bold text-navy">Teacher Login</h5>
                    <p class="text-muted small mb-0">Sign in to mark attendance</p>
                </div>

                <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control form-control-lg" id="username" 
                               placeholder="Enter username" required autocomplete="username">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control form-control-lg" id="password" 
                               placeholder="Enter password" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100" id="loginBtn">
                        <i class="bi bi-box-arrow-in-right"></i> Sign In
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errorEl = document.getElementById('errorAlert');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Signing in...';
    errorEl.classList.add('d-none');

    const formData = new FormData();
    formData.append('username', document.getElementById('username').value);
    formData.append('password', document.getElementById('password').value);

    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            body: formData
        });
        const data = await res.json();
        if (!res.ok) {
            throw new Error(data.detail || 'Login failed');
        }
        localStorage.setItem('token', data.access_token);
        window.location.href = '/dashboard';
    } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('d-none');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Sign In';
    }
});
</script>
{% endblock %}
